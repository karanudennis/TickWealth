<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TickWealth – Even / Odd</title>
<meta name="description" content="Digit Even/Odd with live Deriv ticks, digit frequency circles and paper or live trading.">
<link rel="stylesheet" href="core.css">
</head>
<body>
<div id="top"></div>
<div id="app"></div>
<script src="config.js"></script>
<script src="core.js"></script>
<script src="coach.js"></script>
<script src="digitpage.js"></script>
<script>
TW.digitPage({
  active:'even-odd', theme:'green', title:'DIGIT EVEN / ODD',
  hint:'<b>Even</b> wins if the last digit of the exit tick is 0, 2, 4, 6 or 8; <b>Odd</b> if 1, 3, 5, 7 or 9. The selected side is highlighted.',
  tabs:[{id:'EVEN',label:'● Even'},{id:'ODD',label:'● Odd',cls:'alt'}],
  picker:null,
  contract:t=>t==='EVEN'?'DIGITEVEN':'DIGITODD',
  label:t=>t==='EVEN'?'Even':'Odd',
  header:t=>'DIGITS · '+t+' SELECTED',
  state:(d,t)=>((t==='EVEN')===(d%2===0))?'sel':'dim',
  tag:()=> '',
  scan:(a)=>{
    const e=a.pEven-.5, best=e>=0?{tab:'EVEN',h:e}:{tab:'ODD',h:-e}, s=TW.strength(best.h);
    return {tab:best.tab,strength:s,text:`Even ${(a.pEven*100).toFixed(1)}% vs Odd ${((1-a.pEven)*100).toFixed(1)}% (recency-weighted). Leaning <b>${best.tab}</b>.`};
  }
});
</script>
<script src="advisor.js"></script>
</body>
</html>
