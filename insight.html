<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TickWealth – Insight Lab</title>
<meta name="description" content="Randomness tests, an AI Truth Test for prediction models, a risk simulator and spike probabilities.">
<link rel="stylesheet" href="core.css">
<style>
.pb{max-width:1100px;margin:0 auto;padding:14px;display:grid;gap:14px}.pc{border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px;background:rgba(255,255,255,.04);overflow-x:auto}
.pc h3{margin:0 0 4px}.pn{font-size:12.5px;color:#9fb0cc;margin:4px 0 8px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.1)}th{color:#8e9ab3}
.g{color:#00ffa3}.r{color:#ff3b69}.fm{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:8px 0}.fm label{font-size:11px;color:#8e9ab3;display:block}
.fm input{width:100%;padding:6px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.35);color:#d7e0f2}
</style>
</head>
<body>
<div id="top"></div>
<div id="app"><div class="pb" id="pb"></div></div>
<script src="config.js"></script><script src="core.js"></script><script src="stats.js"></script><script src="pillars.js"></script><script src="coach.js"></script>
<script>
TW.guard('Insight Lab', () => {
  const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
  const pb = document.getElementById('pb'); let F = null, SYM = 'R_100', n = 0;
  const card = (t, note) => { const c = el('div', 'pc'); c.appendChild(el('h3', 0, t)); if (note) c.appendChild(el('div', 'pn', note)); pb.appendChild(c); return c; };
  const table = (c, head, rows) => { const t = el('table'), h = el('tr'); head.forEach(x => h.appendChild(el('th', 0, x))); t.appendChild(h);
    rows.forEach(r => { const tr = el('tr'); r.forEach((x, i) => { const td = el('td', i === r.length - 1 && x.cls ? x.cls : 0, x.t != null ? x.t : x); tr.appendChild(td); }); t.appendChild(tr); }); c.querySelectorAll('table').forEach(x => x.remove()); c.appendChild(t); };
  const top = TW.mountTop({ active: 'insight', symbols: 'all', defaultSymbol: 'R_100', onSymbol: s => load(s) });
  const c1 = card('Randomness suite', 'Four tests on up to 1000 ticks. p-values are multiplied by 4 because four tests were run (Bonferroni), so a lucky single result is not overstated.');
  const c2 = card('AI Truth Test: can simple prediction models beat chance?', 'Each model predicts the next digit or move using only earlier ticks, then is scored on what really came next. Random data should give about 10% for a digit and 50% for a direction. A model that stays at chance has found nothing.');
  const c3 = card('Risk simulator', 'Runs thousands of simulated sessions with your numbers. It shows how often you would hit your loss limit, with and without Martingale.');
  const f = el('div', 'fm'); [['Balance', 'bal', 100], ['Stake', 'stake', 1], ['True chance %', 'ch', 50], ['Payout % on a win', 'po', 92], ['Loss limit', 'lim', 20], ['Trades', 'tr', 200], ['Martingale x', 'mu', 2], ['Max steps', 'st', 4]].forEach(([l, k, v]) => { const d = el('div'); const lb = el('label', 0, l); lb.htmlFor = 'r-' + k; const i = el('input'); i.type = 'number'; i.id = 'r-' + k; i.value = v; d.append(lb, i); f.appendChild(d); }); c3.appendChild(f);
  const go = el('button', 'btn', 'Run 3000 simulations'); c3.appendChild(go); const rsOut = el('div'); c3.appendChild(rsOut);
  const c4 = card('Spike probabilities (Boom and Crash only)', 'Boom and Crash spikes arrive at random with a fixed average rate. The chance of a spike in the next k ticks stays the same however long it has been.');
  const v = id => +document.getElementById(id).value;
  go.onclick = () => { const base = { bal: v('r-bal'), stake: v('r-stake'), pWin: v('r-ch') / 100, payout: v('r-po') / 100, limit: v('r-lim'), trades: v('r-tr'), runs: 3000 };
    const a = TWS.riskSim(Object.assign({ mart: { on: false, mult: 2, steps: 4 } }, base)), b = TWS.riskSim(Object.assign({ mart: { on: true, mult: v('r-mu'), steps: v('r-st') } }, base)), pc = x => (x * 100).toFixed(1) + '%';
    table(rsOut, ['Plan', 'Chance of hitting the loss limit', 'Median end balance', '5th to 95th percentile', 'Avg trades made'], [['Flat stake', pc(a.pHit), a.median.toFixed(2), a.p5.toFixed(2) + ' to ' + a.p95.toFixed(2), a.avgTrades.toFixed(0)], ['Martingale', pc(b.pHit), b.median.toFixed(2), b.p5.toFixed(2) + ' to ' + b.p95.toFixed(2), b.avgTrades.toFixed(0)]]);
    const ev = base.pWin * base.payout - (1 - base.pWin); rsOut.appendChild(el('div', 'pn', 'Expected result per 1 staked: ' + ev.toFixed(3) + (ev < 0 ? ' (a loss on average, so more trades means a larger expected loss).' : '.')));
  };
  function render() {
    const D = F.digits, P = F.prices; if (D.length < 200) { c1.querySelectorAll('table').forEach(x => x.remove()); c1.appendChild(el('div', 'pn', 'Loading ticks... ' + D.length + ' of 1000.')); return; }
    const ds = TWS.digitStats(D), ups = P.slice(1).map((x, i) => x > P[i] ? true : x < P[i] ? false : null), rt = TWS.runsTest(ups), ch = P.slice(1).map((x, i) => x - P[i]), ac = TWS.autocorr(ch, 1);
    const verdict = p => ({ t: p < 0.01 ? 'Deviation: recheck with more data' : 'Consistent with random', cls: p < 0.01 ? 'r' : 'g' });
    const rows = [['Digit uniformity (chi-square, 9 df)', 'chi = ' + ds.chi.toFixed(1), Math.min(1, ds.p * 4).toFixed(3), verdict(Math.min(1, ds.p * 4))]];
    if (rt) rows.push(['Up/down runs test', 'z = ' + rt.z.toFixed(2), Math.min(1, rt.p * 4).toFixed(3), verdict(Math.min(1, rt.p * 4))]);
    rows.push(['Serial correlation of moves (lag 1)', 'r = ' + ac.r.toFixed(3), Math.min(1, ac.p * 4).toFixed(3), verdict(Math.min(1, ac.p * 4))]);
    rows.push(['Entropy of digits', ds.entropy.toFixed(3) + ' of ' + ds.maxEntropy.toFixed(3) + ' bits', '-', { t: ds.entropy / ds.maxEntropy > 0.99 ? 'Near the random maximum' : 'Slightly below maximum (normal for 1000 ticks)', cls: 'g' }]);
    table(c1, ['Test', 'Statistic (' + D.length + ' ticks)', 'Adjusted p', 'Verdict'], rows);
    const tt = TWS.truthTest(D, P); table(c2, ['Model', 'Hits / tries', 'Hit rate', 'Chance', 'Adjusted p', 'Verdict'], tt.map(r => [r.name, r.hits + ' / ' + r.n, (r.rate * 100).toFixed(1) + '%', (r.p0 * 100).toFixed(0) + '%', r.padj.toFixed(3), { t: r.padj < 0.01 && r.rate > r.p0 ? 'Above chance: verify on new ticks' : 'No better than chance', cls: r.padj < 0.01 && r.rate > r.p0 ? 'r' : 'g' }]));
    const m = SYM.match(/^(BOOM|CRASH)(\d+)$/); c4.style.display = m ? '' : 'none';
    if (m) { const N = +m[2], mean = ch.reduce((a, b) => a + Math.abs(b), 0) / ch.length, sp = ch.filter(x => Math.abs(x) > 4 * mean).length;
      table(c4, ['Within the next', 'Chance of at least one spike'], [10, 50, 100, 500].map(k => [k + ' ticks', (TWS.spikeProb(N, k) * 100).toFixed(1) + '%']));
      c4.appendChild(el('div', 'pn', 'Designed average: 1 spike per ' + N + ' ticks. In the loaded ' + ch.length + ' ticks, ' + sp + ' moves were over 4 times the average (about 1 per ' + (sp ? Math.round(ch.length / sp) : '-') + ').')); }
  }
  function load(s) { SYM = s; n = 0; if (F) F.close(); F = TW.tickFeed(s, { primary: false, count: 1000, onHistory: render, onTick: () => { if (++n % 25 === 0) render(); } }); }
  load(top.symbol || 'R_100');
});
</script>
</body>
</html>
